# lora_config.yaml
model: "Qwen/Qwen2.5-32B-Instruct"
train: true
fine_tune_type: lora
data: "data" 
seed: 42

# 1. UPDATED KEY: Use 'num_layers' instead of 'lora_layers'
# Targeting all 64 layers of the 32B model for maximum semantic adaptation
num_layers: 64           

# 2. KEEP THESE: These are fully supported in 0.31.2
lora_parameters:
  keys: ["q_proj", "v_proj", "k_proj", "o_proj", "gate_proj", "down_proj", "up_proj"]
  rank: 16                
  alpha: 32               
  dropout: 0.05

# Training Parameters
batch_size: 8             
iters: 3500               
learning_rate: 2e-5       
steps_per_eval: 100       
save_every: 500           
adapter_path: "adapters"
