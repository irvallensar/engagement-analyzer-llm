model: "mlx-community/Qwen2.5-32B-Instruct-4bit"
train: true
fine_tune_type: lora
data: "data"
seed: 42

num_layers: 64

lora_parameters:
  keys:
    - "layers.*.self_attn.q_proj"
    - "layers.*.self_attn.k_proj"
    - "layers.*.self_attn.v_proj"
    - "layers.*.mlp.gate_proj"
    - "layers.*.mlp.down_proj"
    - "layers.*.mlp.up_proj"
  rank: 16
  scale: 20.0
  dropout: 0.05

batch_size: 1
iters: 1
learning_rate: 2e-5
steps_per_eval: 1
save_every: 500
adapter_path: "adapters"
