# lora_config.yaml
model: "Qwen/Qwen2.5-32B-Instruct-4bit"
train: true
fine_tune_type: lora
data: "data"
seed: 42

# Number of transformer layers to apply LoRA to (counted from the last layer)
lora_layers: 16          # start with 16, not 64 — see note below

lora_parameters:
  rank: 16
  alpha: 32
  dropout: 0.05
  # DO NOT include 'keys' here — it's not a valid subfield in most versions

# Training Parameters
batch_size: 1            # see note below
iters: 3500
learning_rate: 2e-5
steps_per_eval: 100
save_every: 500
adapter_path: "adapters"
val_batches: 25
