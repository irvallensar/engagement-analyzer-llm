model: "mlx-community/Qwen2.5-14B-Instruct-4bit"
data: "data"
train: true
iters: 4000
batch_size: 4
learning_rate: 5e-6
steps_per_eval: 100
save_every: 100

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
